name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The API suite runs against a live Postgres — the assignment path is advisory-lock and
    # transaction behaviour, which a mock cannot exercise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phoneup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phoneup_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same command the container runs on deploy, so a broken migration fails here first.
      - name: Migrate test database
        run: pnpm --filter @phoneup/db migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # The API ships via tsx, which strips types without checking them — this is the only
      # thing that typechecks it.
      - run: pnpm typecheck

      - run: pnpm -r test

      - run: pnpm -r build
